services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=novawallet;Username=novawallet;Password=novawallet"
      # This container never leaves your machine and signs nothing anyone else can verify
      # against, so a static value here is fine -- unlike appsettings.json (which ships with
      # NO signing key at all and fails fast at startup if one isn't supplied, see Program.cs).
      # A real deployment injects this from a secrets manager, never from a compose file.
      Jwt__SigningKey: "local-docker-compose-only-static-value-2f9a7c1e6b3d8f45"
      Jwt__Issuer: "novawallet-ledger"
      Jwt__Audience: "novawallet-clients"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      POSTGRES_PASSWORD: novawallet
    # No host port published: the api container reaches this over the internal docker-compose
    # network by service name ("postgres"), and not publishing avoids any chance of colliding
    # with (or being mistaken for) a Postgres instance already running on the host.
    volumes:
      - novawallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  novawallet-pgdata:
